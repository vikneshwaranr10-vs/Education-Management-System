spring:
  application:
    name: education-management-system

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/education_db
    username: root
    password: YOUR_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: EducationHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

logging:
  level:
    com.example: INFO

file:
  upload-dir: uploads

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,education